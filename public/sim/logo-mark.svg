<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 0 580 580" role="img" aria-label="Северный дрон — знак">
  <title>Северный дрон</title>
  <!-- снежинка, лучи которой — дроны; тёмно-синий с оранжевыми навигационными огнями -->
  <g fill="none" stroke="#14284b" stroke-width="13" stroke-linecap="square" stroke-linejoin="miter" transform="translate(-235 -225)">
    <!-- ствол -->
    <line x1="495" y1="232" x2="495" y2="792"/>
    <!-- верх: камера-«трезубец» -->
    <path d="M465 258 V318 L495 346 L525 318 V258"/>
    <!-- верхние ветви к дронам -->
    <path d="M495 430 L428 372 M495 430 L562 372"/>
    <path d="M455 395 L470 360 M535 395 L520 360"/>
    <!-- дроны: моторы и лучи -->
    <path d="M320 400 Q320 382 345 382 Q370 382 370 400 Q370 418 345 418 L330 418"/>
    <path d="M670 400 Q670 382 645 382 Q620 382 620 400 Q620 418 645 418 L660 418"/>
    <path d="M372 410 L440 448 M618 410 L550 448"/>
    <!-- нижние ветви -->
    <path d="M495 510 L420 560 M495 510 L570 560"/>
    <path d="M420 560 L370 600 M570 560 L620 600"/>
    <path d="M402 520 L372 545 L340 545 M588 520 L618 545 L650 545"/>
    <path d="M440 530 L462 560 M550 530 L528 560"/>
    <!-- «ёлочка» внизу ствола -->
    <path d="M462 625 L495 598 L528 625 M462 662 L495 635 L528 662 M462 699 L495 672 L528 699"/>
  </g>
  <!-- пропеллеры -->
  <g fill="#14284b" transform="translate(-235 -225)">
    <rect x="248" y="368" width="170" height="13" rx="6.5"/>
    <rect x="572" y="368" width="170" height="13" rx="6.5"/>
  </g>
  <!-- оранжевые огни -->
  <g stroke="#f07a1a" stroke-width="13" stroke-linecap="butt" transform="translate(-235 -225)">
    <line x1="495" y1="262" x2="495" y2="290"/>
    <line x1="300" y1="578" x2="335" y2="561"/>
    <line x1="690" y1="578" x2="655" y2="561"/>
  </g>
  <g stroke="#14284b" stroke-width="13" transform="translate(-235 -225)">
    <line x1="335" y1="561" x2="372" y2="543"/>
    <line x1="655" y1="561" x2="618" y2="543"/>
  </g>
</svg>
