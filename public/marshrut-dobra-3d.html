<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Маршрут добра 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: иллюстрированная настольная игра — карта-парк слева, кремовые панели с фиолетовыми ярлыками справа; на телефоне в одну колонку.
   Один светлый «картонный» стиль намеренно: цвета заданы явно и не зависят от темы. */
:root{
  color-scheme:light;
  --bg:#E9F1D8; --panel:#FFF9EE; --panel-line:#EADBC0; --ink:#3A2A1E; --muted:#7A6955;
  --plum:#5A3D91; --plum-soft:#EFE7FA;
  --wood:#DDA25A; --wood-2:#BE7B3A; --wood-dark:#6E4220;
  --go:#4FA343; --go-dark:#3A7F31;
  --red:#E04A57; --green:#4E9E3E; --yellow:#F2B21F; --purple:#7B4FC9;
  --red-soft:#FBE1E3; --green-soft:#E6F2D2; --yellow-soft:#FFF1CC; --purple-soft:#EEE6FA;
  --shadow:0 2px 0 rgba(110,66,32,.12),0 10px 24px rgba(70,60,30,.12);
  --f-display:"Balsamiq Sans","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);background-image:radial-gradient(circle at 15% 0%,#F3EEDC 0,transparent 45%),radial-gradient(circle at 90% 10%,#E6DEF5 0,transparent 40%);
  color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--plum);outline-offset:2px}
.wrap{max-width:1360px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

/* шапка: деревянная табличка */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sign{position:relative;padding:14px 30px 14px;border-radius:14px;color:var(--ink);transform:rotate(-1.2deg);
  background:repeating-linear-gradient(180deg,transparent 0 23px,rgba(110,66,32,.18) 23px 25px),linear-gradient(180deg,#E9B46B,var(--wood) 55%,var(--wood-2));
  border:4px solid var(--wood-dark);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 6px 0 rgba(110,66,32,.25)}
.sign::before,.sign::after{content:"";position:absolute;top:10px;width:10px;height:10px;border-radius:50%;background:#7A5A3A;box-shadow:inset -2px -2px 0 rgba(0,0,0,.3)}
.sign::before{left:9px}.sign::after{right:9px}
.sign h1{font-size:clamp(28px,4.4vw,46px);letter-spacing:.01em;color:#3B2414;text-shadow:0 2px 0 rgba(255,255,255,.35)}
.sign p{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(14px,1.7vw,18px);color:#4A2E18}
.sign p span{color:var(--red)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:3px solid var(--panel-line);background:var(--panel);padding:8px 16px;border-radius:14px;font-family:var(--f-display);font-weight:700;font-size:16px;box-shadow:0 3px 0 var(--panel-line)}
.tabs button[aria-selected="true"]{background:var(--plum);border-color:var(--plum);color:#fff;box-shadow:0 3px 0 #3E2868}

/* раскладка */
.game{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
@media (max-width:980px){.game{grid-template-columns:minmax(0,1fr)}}
.board{border-radius:24px;overflow:hidden;border:5px solid var(--panel);box-shadow:var(--shadow);background:#CFC4EE;min-width:0}
.board svg{display:block;width:100%;height:auto}
.board3d{position:relative;background:#D8CCF2;min-height:340px}
.b3-wrap{position:relative;width:100%}
.b3-wrap canvas{display:block;width:100%;touch-action:none;cursor:grab}
.b3-wrap canvas:active{cursor:grabbing}
.b3-ui{position:absolute;top:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.b3-btn{border:3px solid var(--panel-line);background:var(--panel);border-radius:12px;padding:6px 12px;font-family:var(--f-display);font-weight:700;font-size:14px;box-shadow:0 3px 0 var(--panel-line)}
.b3-btn[aria-pressed="true"]{background:var(--plum);border-color:var(--plum);color:#fff;box-shadow:0 3px 0 #3E2868}
.b3-tip{position:absolute;left:10px;bottom:10px;background:rgba(255,249,238,.85);border-radius:10px;padding:4px 10px;font-size:12.5px;font-weight:700;color:var(--muted);pointer-events:none}
.side{display:flex;flex-direction:column;gap:22px;min-width:0;padding-top:12px}

/* панели с фиолетовым ярлыком */
.panel{position:relative;background:var(--panel);border:3px solid var(--panel-line);border-radius:20px;padding:30px 16px 16px;box-shadow:var(--shadow);min-width:0}
.ptag{position:absolute;top:-17px;left:14px;background:var(--plum);color:#fff;font-family:var(--f-display);font-weight:700;font-size:18px;
  padding:5px 16px 6px;border-radius:12px 12px 12px 4px;box-shadow:0 3px 0 #3E2868;white-space:nowrap}
.muted{color:var(--muted);font-size:14px}

.turn{display:flex;flex-direction:column;gap:12px}
.turn-head{display:flex;align-items:center;gap:12px}
.turn-name{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.1}
.roll-row{display:flex;align-items:center;gap:14px}
.die{width:78px;height:78px;flex:none;border-radius:18px;background:#fff;border:3px solid #E2DAD0;
  display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:11px;gap:2px;box-shadow:0 5px 0 #D2C8BC,inset -4px -4px 0 #F1ECE6}
.die i{width:14px;height:14px;border-radius:50%;background:#1E1E1E;place-self:center;opacity:0}
.die i.on{opacity:1}
.die.rolling{animation:shake .5s linear infinite}
@keyframes shake{0%{transform:rotate(0)}25%{transform:rotate(-14deg) translateY(-3px)}50%{transform:rotate(10deg)}75%{transform:rotate(-6deg) translateY(-2px)}100%{transform:rotate(0)}}
.btn{border:0;border-radius:16px;padding:13px 18px;font-family:var(--f-display);font-weight:700;font-size:18px;background:var(--go);color:#fff;box-shadow:0 5px 0 var(--go-dark);text-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--go-dark)}
.btn[disabled]{opacity:.5;cursor:not-allowed;filter:grayscale(.3)}
.btn.ghost{background:var(--panel);color:var(--ink);border:3px solid var(--panel-line);box-shadow:0 4px 0 var(--panel-line);text-shadow:none}
.btn.big{flex:1;padding:16px}
.hint{font-size:15px;color:var(--muted);min-height:1.45em}
.hint b{color:var(--ink)}

.pawn{height:58px;width:auto;flex:none;filter:drop-shadow(0 2px 2px rgba(60,40,20,.25))}
.turn-head .pawn{height:96px}
.team .pawn{justify-self:center}
.teams{display:flex;flex-direction:column;gap:8px}
.team{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:16px;border:3px solid transparent}
.team.cur{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 10%,var(--panel))}
.team .n{font-family:var(--f-display);font-weight:700;font-size:17px;overflow-wrap:anywhere;line-height:1.15}
.team .p{font-size:13px;color:var(--muted)}
.team .p em{font-style:normal;color:var(--purple);font-weight:800}
.hearts{display:flex;align-items:center;gap:5px}
.hearts b{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums;color:var(--red);min-width:1.3em;text-align:right}
.hearts svg{width:20px;height:20px}
.adj{width:26px;height:26px;border-radius:9px;border:2px solid var(--panel-line);background:#fff;font-weight:800;line-height:1;padding:0}
.bank{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);padding-top:10px;border-top:2px dashed var(--panel-line);margin-top:6px}
.bank b{color:var(--ink);font-variant-numeric:tabular-nums}

.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:200px;overflow:auto;font-size:14px}
.log li{padding-left:12px;border-left:3px solid var(--panel-line);color:var(--muted)}
.log li:first-child{color:var(--ink);border-left-color:var(--plum)}

.legend{display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px;background:var(--panel)}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;padding:4px 10px 4px 4px;border-radius:12px;background:var(--cs)}
.legend svg{width:26px;height:26px}

/* SVG карты */
.piece{transition:transform .22s ease-in-out}
.piece.active .bob{animation:bob .9s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-7px)}}

/* модальные окна */
.overlay{position:fixed;inset:0;background:rgba(40,30,60,.5);display:grid;place-items:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.card{width:min(480px,100%);border-radius:26px;background:var(--panel);border:5px solid #fff;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85) rotate(-3deg);opacity:0}}
.card-top{background:var(--cc);color:#fff;padding:18px 22px;display:flex;align-items:center;gap:14px}
.card-top .ic{width:60px;height:60px;border-radius:18px;background:#fff;display:grid;place-items:center;flex:none;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.card-top .ic svg{width:42px;height:42px}
.card-top h2{font-size:24px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.card-top small{display:block;font-weight:800;opacity:.95;font-size:13px}
.card-body{padding:22px;display:flex;flex-direction:column;gap:18px;background:var(--cs)}
.card-text{font-family:var(--f-display);font-size:23px;font-weight:700;line-height:1.3;text-wrap:pretty}
.card-for{font-size:15px;color:var(--muted)}
.timer{display:flex;align-items:center;gap:12px}
.timer-num{font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;min-width:3.4ch}
.timer-bar{flex:1;height:12px;border-radius:99px;background:rgba(0,0,0,.08);overflow:hidden}
.timer-bar i{display:block;height:100%;background:var(--cc);width:100%;transition:width 1s linear}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1 1 160px}
.btn.no{background:#fff;border:3px solid var(--panel-line);color:var(--ink);box-shadow:0 4px 0 var(--panel-line);text-shadow:none}

/* стартовый экран */
.team-setup{display:flex;flex-direction:column;gap:12px}
.ts{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:16px;border:3px solid var(--panel-line);background:#fff}
.ts-head{display:flex;gap:10px;align-items:center}
.ts-head .pawn{height:52px}
.ts input{flex:1;min-width:0;font-family:var(--f-display);font-weight:700;font-size:18px;padding:8px 12px;border-radius:12px;border:2px solid var(--panel-line);background:var(--panel);color:var(--ink)}
.figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.fig{border:2px solid var(--panel-line);background:var(--panel);border-radius:12px;padding:6px 3px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:800;text-align:center;line-height:1.15}
.fig img{height:74px;width:auto}
.fig[aria-pressed="true"]{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 16%,#fff);box-shadow:0 3px 0 var(--tc)}
.fig[disabled]{opacity:.35;cursor:not-allowed}
.count{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.count button{border:2px solid var(--panel-line);background:#fff;border-radius:10px;padding:5px 14px;font-family:var(--f-display);font-weight:700;font-size:17px}
.count button[aria-pressed="true"]{background:var(--plum);color:#fff;border-color:var(--plum)}

/* правила и карточки */
.page{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,310px),1fr));gap:30px 18px;padding-top:16px;align-items:start}
.page ul,.page ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:7px}
.steps{list-style:none;padding:0!important;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.steps li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--plum);color:#fff;font-family:var(--f-display);font-weight:700;display:grid;place-items:center}
.kinds{display:flex;flex-direction:column;gap:8px}
.kind{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;padding:6px;border-radius:14px;background:var(--cs)}
.kind svg{width:48px;height:48px}
.kind b{font-family:var(--f-display);font-size:17px;display:block}
.kind small{color:var(--muted);font-weight:700}
.kind .cnt{font-family:var(--f-display);font-weight:700;font-size:18px;padding-right:8px}
table{width:100%;border-collapse:collapse;font-size:15px}
td{padding:7px 0;border-bottom:2px dashed var(--panel-line)}
td:last-child{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.deck{border-radius:22px;overflow:hidden;box-shadow:var(--shadow);background:var(--cs);border:4px solid #fff}
.deck .card-top{padding:14px 18px}
.deck ol{padding:16px 18px 18px 36px;margin:0;display:flex;flex-direction:column;gap:8px;font-weight:700}

/* финал */
.final .card-top{justify-content:center;text-align:center;flex-direction:column;padding:26px 22px}
.final .card-top h2{font-size:28px}
.podium{display:flex;flex-direction:column;gap:10px}
.pod{display:grid;grid-template-columns:44px minmax(0,1fr) auto;position:relative;gap:12px;align-items:center;padding:12px;border-radius:16px;background:#fff;border:3px solid var(--panel-line)}
.pod.win{border-color:var(--yellow);box-shadow:0 4px 0 var(--yellow)}
.pod .big{text-align:center}.pod .big .pawn{height:64px}.pod.win::after{content:'🏆';position:absolute;top:-12px;right:-8px;font-size:26px}
.pod .nm{font-family:var(--f-display);font-weight:700;font-size:18px}
.pod b{font-family:var(--f-display);color:var(--red);font-size:22px}
.pod small{display:block;color:var(--muted);font-weight:700}
canvas.conf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="sign"><h1>Маршрут добра</h1><p>— сделаем город добрее вместе! <span>♡</span></p></div>
    <nav class="tabs" role="tablist">
      <button role="tab" id="tab-game" aria-selected="true" data-tab="game">Игра</button>
      <button role="tab" id="tab-rules" aria-selected="false" data-tab="rules">Правила</button>
      <button role="tab" id="tab-cards" aria-selected="false" data-tab="cards">Карточки</button>
    </nav>
  </header>
  <main id="view"></main>
</div>
<div id="modal"></div>

// иконки клеток в квадрате −20..20
function icon(k){
  if(k==='H')return `<path d="M0 15 C -20 2,-15 -17,0 -7 C 15 -17,20 2,0 15Z" fill="#E04A57" stroke="#B8323F" stroke-width="2"/><ellipse cx="-7" cy="-6" rx="3.5" ry="2.5" fill="#fff" opacity=".55"/>`;
  if(k==='L')return `<path d="M0 16 V-1" stroke="#3E8A2E" stroke-width="3" stroke-linecap="round"/><path d="M0 4 C -15 5,-17 -8,-15 -13 C -6 -14,1 -8,0 4Z" fill="#5DAE3E" stroke="#3E8A2E" stroke-width="2"/><path d="M0 0 C 13 0,17 -11,15 -16 C 6 -16,0 -11,0 0Z" fill="#76C24E" stroke="#3E8A2E" stroke-width="2"/>`;
  if(k==='S'){let p=[];for(let i=0;i<10;i++){const r=i%2?7:16,a=-Math.PI/2+i*Math.PI/5;p.push((r*Math.cos(a)).toFixed(1)+','+(r*Math.sin(a)+1).toFixed(1))}
    return `<polygon points="${p.join(' ')}" fill="#FFC928" stroke="#D18B10" stroke-width="2.2" stroke-linejoin="round"/>`}
  if(k==='X')return `<circle r="15" fill="#7B4FC9" stroke="#5A3696" stroke-width="2"/><rect x="-2.6" y="-9" width="5.2" height="11" rx="2.6" fill="#fff"/><circle cy="7" r="2.8" fill="#fff"/>`;
  return '';
}
const iconSVG=k=>`<svg viewBox="-20 -20 40 40" aria-hidden="true">${icon(k)}</svg>`;

function mount3D(){
  const slot=$('#b3');if(!slot)return;
  if(!window.THREE){slot.innerHTML='<p style="padding:24px">Не удалось загрузить 3D-движок. Проверьте подключение к интернету и обновите страницу.</p>';return}
  if(!R)init3D();
  slot.appendChild(R.wrap);R.resize();sync3D();
}
function sync3D(){
  if(!R)return;const list=viewTeams();
  R.pieces.forEach((p,i)=>{if(p&&i>=list.length)p.g.visible=false});
  list.forEach((t,i)=>{const p=R.piece(i);p.g.visible=true;R.setFig(p,t.fig);if(!p.busy)p.g.position.copy(piecePos(i,t.pos))});
  R.setActive(S.phase==='play'?S.cur:-1);
}
function hopTo(i,pos){
  if(!R)return wait(reduced?40:240);
  const p=R.piece(i),from=p.g.position.clone(),to=piecePos(i,pos),dur=reduced?60:250,t0=performance.now();p.busy=true;
  return new Promise(res=>{(function step(){const u=Math.min(1,(performance.now()-t0)/dur);p.g.position.lerpVectors(from,to,u);p.g.position.y+=Math.sin(u*Math.PI)*.7;
    if(u<1)requestAnimationFrame(step);else{p.busy=false;p.g.position.copy(to);res()}})()});
}
const throwDie=n=>R?R.throwDie(n):wait(600);

function render(){
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));
  const v=$('#view');
  if(tab==='rules'){v.innerHTML=rulesHTML();return}
  if(tab==='cards'){v.innerHTML=cardsHTML();return}
  if(S.phase==='setup'){v.innerHTML=setupHTML();mount3D();return}
  v.innerHTML=gameHTML();
  mount3D();
  setDie(S.lastRoll||1);
  if(S.phase==='end')showFinal();
}

      <li>Команды по очереди бросают кубик и идут на столько клеток, сколько выпало.</li>
      <li>На цветной клетке ведущий открывает карточку её цвета.</li>
      <li>Справились с заданием — команда получает сердечко. Не справились — сердечка нет. Ход переходит следующей команде.</li>
      <li>На финиш нужно попасть точно: если выпало больше, фигурка стоит на месте.</li>
      <li>Первая команда на финише получает ещё ${heartsW(FINISH_BONUS)}, и игра заканчивается. Побеждает команда с наибольшим числом сердечек; при равенстве — та, что пришла первой.</li>
    </ol></div>
    <div class="panel"><div class="ptag">Виды карточек</div><div class="kinds">
      ${Object.entries(TYPES).map(([k,t])=>`<div class="kind" style="--cs:var(${t.s})">${iconSVG(k)}<div><b>${t.n}</b><small>— ${t.sub}</small></div><span class="cnt">${cnt(k)} кл.</span></div>`).join('')}
      <div class="kind" style="--cs:#FCF3E0"><svg viewBox="-20 -20 40 40" aria-hidden="true"><rect x="-15" y="-15" width="30" height="30" rx="8" fill="#FCF3E0" stroke="#D3B987" stroke-width="2.5"/></svg><div><b>Обычная клетка</b><small>— ждём следующего хода</small></div><span class="cnt">${cnt('O')} кл.</span></div>
    </div></div>
    <div class="panel"><div class="ptag">Награды</div><ul>
      <li>🏆 Победителям — золотой кубок «Главные волонтёры города».</li>
      <li>🍫 Каждому участнику победившей команды — шоколадка.</li>
      <li>📜 Второй команде — диплом «Добрые сердца».</li>
      <li>❤️ За каждое выполненное задание — бумажное сердечко.</li></ul></div>
    <div class="panel"><div class="ptag">Что понадобится?</div><table>
      <tr><td>Экран или проектор с игрой</td><td>1</td></tr><tr><td>Кубик, фишки и ${TOTAL_CARDS} карточек</td><td>в игре</td></tr>
      <tr><td>Бумажные сердечки-награды</td><td>${BANK}</td></tr><tr><td>Диплом «Добрые сердца»</td><td>1</td></tr><tr><td>Главный приз</td><td>1</td></tr></table></div>
    <div class="panel"><div class="ptag">Сколько длится</div><table>
      <tr><td>Объяснение правил</td><td>2 мин</td></tr><tr><td>Игровой процесс</td><td>20–25 мин</td></tr>
      <tr><td>Подсчёт сердечек</td><td>2 мин</td></tr><tr><td>Награждение</td><td>2 мин</td></tr>
      <tr><td><b>Всего</b></td><td>26–31 мин</td></tr></table></div>
  </section>`;
}
function cardsHTML(){
  return `<section class="page">${Object.entries(TYPES).map(([k,t])=>`<div class="deck" style="--cc:var(${t.c});--cs:var(${t.s})">
    <div class="card-top"><div class="ic">${iconSVG(k)}</div><div><small>${t.color[0].toUpperCase()+t.color.slice(1)} карточки</small><h2>${t.n}</h2></div></div>
    <ol>${CARDS[k].map(c=>`<li>${c.t}</li>`).join('')}</ol></div>`).join('')}</section>`;
}

/* ---------- кубик и ходы ---------- */
function setDie(n){const d=$('#die');if(!d)return;[...d.children].forEach((p,i)=>p.classList.toggle('on',PIPS[n].includes(i)))}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function setHint(h){S.hint=h;const el=$('#hint');if(el)el.innerHTML=h}

async function roll(){
  if(busy||S.phase!=='play'||tab!=='game')return;
  busy=true;$('#roll').disabled=true;
  const n=1+rnd(6);
  const d=$('#die');d.classList.add('rolling');
  const flick=(async()=>{for(let k=0;k<(reduced?1:14);k++){setDie(1+rnd(6));await wait(70)}})();
  await Promise.all([throwDie(n),flick]);
  setDie(n);d.classList.remove('rolling');S.lastRoll=n;
  const t=S.teams[S.cur];
  log(`<b>${esc(t.name)}</b> выбросили ${n}.`);
  const need=FINISH-t.pos;
  if(n>need){
    log(`До финиша ${cellsW(need)} — нужно точное число. Фигурка остаётся на месте.`);
    setHint(`Выпало <b>${n}</b>, а до финиша ${cellsW(need)}. Стоим на месте.`);
    await wait(900);return endTurn();
  }
  setHint(`Выпало <b>${n}</b>! Идём…`);
  for(let s=0;s<n;s++){
    t.pos++;
    await hopTo(S.cur,t.pos);
  }
  land();
}
function land(){
  const t=S.teams[S.cur], c=CELLS[t.pos];
  R?.bump(t.pos);
  if(c==='FIN')return finish();
  if(c==='O'){
    log(`Клетка ${t.pos} — обычная.`);
    return endTurn();
  }
  // колода тасуется заново, только когда все карточки цвета уже были
  if(!S.decks[c].length){let d=shuffle(CARDS[c].map((_,i)=>i));if(d[0]===S.lastCard?.[c])d.push(d.shift());S.decks[c]=d;log(`Колода «${TYPES[c].n}» закончилась — перемешали заново.`)}
  const idx=S.decks[c].shift();S.lastCard={...(S.lastCard||{}),[c]:idx};
  S.open={type:c,idx};save();
  showCard();
}
function endTurn(again){
  closeModal();
  if(!again){
    const n=S.teams.length;
    for(let k=0;k<n;k++){
      S.cur=(S.cur+1)%n;
      const t=S.teams[S.cur];
      if(t.skip){t.skip=0;log(`<b>${esc(t.name)}</b> пропускают ход.`);continue}
      break;
    }
  }
  const t=S.teams[S.cur];
  S.hint=again?`<b>${esc(t.name)}</b> ходят ещё раз!`:`Ход команды <b>${esc(t.name)}</b>.`;
  busy=false;save();render();
}
function finish(){
  const t=S.teams[S.cur];
  t.hearts+=FINISH_BONUS;t.finished=true;
  log(`🏆 <b>${esc(t.name)}</b> первыми дошли до финиша и получают ${heartsW(FINISH_BONUS)}!`);
  S.phase='end';S.finisher=S.cur;S.hint=`<b>${esc(t.name)}</b> на финише! Игра окончена.`;busy=false;save();render();
}

/* ---------- карточка ---------- */
function showCard(){
  const {type,idx}=S.open, ty=TYPES[type], card=CARDS[type][idx], t=S.teams[S.cur];
  const surprise=type==='X'&&card.fx!=='ask';
  const sec=card.sec||60;
  $('#modal').innerHTML=`<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="ctitle">
    <div class="card" style="--cc:var(${ty.c});--cs:var(${ty.s})">
      <div class="card-top"><div class="ic">${iconSVG(type)}</div><div><small>Клетка ${t.pos} · ${ty.color} карточка</small><h2 id="ctitle">${ty.n}</h2></div></div>
      <div class="card-body">
        <div class="card-for">Задание для команды <b>${esc(t.name)}</b> · в колоде осталось ${S.decks[type].length} из ${CARDS[type].length}</div>
        <div class="card-text">${card.t}</div>
        ${surprise?'':`<div class="timer"><div class="timer-num" id="tnum">${fmt(sec)}</div><div class="timer-bar"><i id="tbar"></i></div><button class="btn ghost" id="tstart" data-sec="${sec}">Заново</button></div>`}
        <div class="actions">${surprise
          ?`<button class="btn" id="fx" style="background:var(--purple);color:#fff">${fxLabel(card.fx)}</button>`
          :`<button class="btn ok" id="ok">Справились ❤️ +1</button><button class="btn no" id="no">Не справились</button>`}</div>
      </div></div></div>`;
  ($('#ok')||$('#fx')).focus();
  if(!surprise)startTimer(sec);
}
const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
const fxLabel=fx=>({again:'Ходить ещё раз',h2:'Забрать 2 сердечка',skip:'Понятно, пропускаем',h1:'Забрать сердечко',help:'Другая команда помогла',fwd2:'Вперёд на 2 клетки',fwd3:'Вперёд на 3 клетки',back2:'Назад на 2 клетки',share:'Подарить сердечко',all1:'Всем по сердечку'}[fx]);
function closeModal(){clearInterval(timerId);timerId=null;$('#modal').innerHTML='';S.open=null}
function startTimer(sec){
  clearInterval(timerId);let left=sec;const num=$('#tnum'),bar=$('#tbar');if(!num)return;num.textContent=fmt(sec);num.style.color='';
  bar.style.width='100%';
  timerId=setInterval(()=>{left--;num.textContent=fmt(Math.max(0,left));bar.style.width=(Math.max(0,left)/sec*100)+'%';
    if(left<=0){clearInterval(timerId);timerId=null;num.textContent='Время!';num.style.color='var(--red)';beep()}},1000);
}
let actx=null;
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();[0,.25].forEach(d=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.2,actx.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d+.2);o.start(actx.currentTime+d);o.stop(actx.currentTime+d+.22)})}catch(e){}}
function resolveTask(ok){
  const t=S.teams[S.cur];
  if(ok){t.hearts++;log(`<b>${esc(t.name)}</b> справились с заданием «${TYPES[S.open.type].n}» и получают сердечко ❤️`)}
  else log(`<b>${esc(t.name)}</b> не справились — сердечка нет.`);
  endTurn();
}
async function moveBy(d){
  const t=S.teams[S.cur];
  const target=Math.max(0,Math.min(FINISH,t.pos+d));
  while(t.pos!==target){t.pos+=Math.sign(d);await hopTo(S.cur,t.pos);}
}
async function applyFx(){
  if(busyFx)return;busyFx=true;
  const t=S.teams[S.cur], fx=CARDS.X[S.open.idx].fx, nm=`<b>${esc(t.name)}</b>`;
  try{
  if(fx==='again'){log(`${nm}: ещё один ход!`);return endTurn(true)}
  if(fx==='h2'){t.hearts+=2;log(`${nm} получают 2 ❤️`)}
  if(fx==='h1'){t.hearts+=1;log(`${nm} получают 1 ❤️`)}
  if(fx==='skip'){t.skip=1;log(`${nm} пропустят следующий ход.`)}
  if(fx==='help'){log(`${nm} попросили помощи у другой команды.`)}
  if(fx==='all1'){S.teams.forEach(x=>x.hearts++);log(`Праздник в городе: все команды получают по 1 ❤️`)}
  if(fx==='share'){const others=S.teams.filter(x=>x!==t);const min=Math.min(...others.map(x=>x.hearts));const to=others.find(x=>x.hearts===min);to.hearts++;log(`${nm} сделали доброе дело: <b>${esc(to.name)}</b> получают 1 ❤️`)}
  if(fx==='fwd2'||fx==='fwd3'||fx==='back2'){
    const d=fx==='back2'?-2:+fx.slice(3);
    if(d>0&&t.pos+d>FINISH){log(`${nm}: до финиша меньше ${cellsW(d)}, фигурка стоит на месте.`)}
    else{closeModalIfCard();await moveBy(d);log(`${nm} ${d>0?'идут вперёд':'возвращаются назад'} на ${cellsW(Math.abs(d))} — клетка ${t.pos||'«Старт»'}.`);if(t.pos===FINISH){S.open=null;return finish()}}
  }
  endTurn();
  }finally{busyFx=false}
}

/* ---------- финал ---------- */
function showFinal(){
  const order=S.teams.map((t,i)=>({...t,i})).sort((a,b)=>b.hearts-a.hearts||(b.i===S.finisher)-(a.i===S.finisher));
  const w=order[0];
  $('#modal').innerHTML=`<div class="overlay final" role="dialog" aria-modal="true" aria-labelledby="ftitle">
    <div class="card" style="--cc:var(--red);--cs:var(--bg)">
      <div class="card-top"><div class="ic" style="width:76px;height:76px"><svg viewBox="-40 -56 80 86" aria-hidden="true" style="width:56px;height:56px">${trophy(0,0,1)}</svg></div><h2 id="ftitle">Вы сделали этот город добрее!</h2><small>Подсчёт сердечек и награждение</small></div>
      <div class="card-body">
        <div class="podium">${order.map((t,k)=>`<div class="pod${k===0?' win':''}">
          <div class="big">${pawnSVG(fig(t.fig))}</div>
          <div><div class="nm">${esc(t.name)}</div><small>${k===0?'Главные волонтёры города · кубок и шоколадки':'Диплом «Добрые сердца»'}${t.i===S.finisher?' · первыми на финише':''}</small></div>
          <b>${t.hearts} ❤️</b></div>`).join('')}</div>
        <div class="card-for">Всего собрано ${heartsW(given())}. Спасибо всем волонтёрам!</div>
        <div class="actions"><button class="btn" id="again">Сыграть ещё раз</button><button class="btn no" id="viewboard">Посмотреть карту</button></div>
      </div></div></div>`;
  confetti();
}
function confetti(){
  if(reduced||document.querySelector('canvas.conf'))return;
  const c=document.createElement('canvas');c.className='conf';document.body.appendChild(c);
  const x=c.getContext('2d');const W=c.width=innerWidth,H=c.height=innerHeight;
  const cols=['#DE434C','#3B9E49','#EDB021','#8657CF','#2C7DD6'];
  const P=Array.from({length:90},()=>({x:Math.random()*W,y:-20-Math.random()*H*.6,v:2+Math.random()*3,r:6+Math.random()*8,a:Math.random()*6,c:cols[Math.random()*5|0]}));
  let f=0;(function step(){x.clearRect(0,0,W,H);P.forEach(p=>{p.y+=p.v;p.a+=.05;const s=p.r;x.save();x.translate(p.x+Math.sin(p.a)*10,p.y);x.fillStyle=p.c;
    x.beginPath();x.moveTo(0,s*.35);x.bezierCurveTo(-s,-s*.3,-s*.4,-s,0,-s*.45);x.bezierCurveTo(s*.4,-s,s,-s*.3,0,s*.35);x.fill();x.restore()});
    if(++f<240)requestAnimationFrame(step);else c.remove()})();
}

/* ---------- старт ---------- */
function newGame(){
  const st=S.setup;
  S.teams=st.teams.slice(0,st.count).map(t=>({name:t.name.trim()||'Команда',fig:t.fig,pos:0,hearts:0,skip:0}));
  S.v=2;S.lastCard={};S.phase='play';S.cur=0;S.decks=freshDecks();S.log=['Маршрут начинается! Команды стоят на старте.'];S.open=null;S.finisher=null;
  S.hint=`Первыми ходят <b>${esc(S.teams[0].name)}</b>.`;
  save();render();
}

document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.tab){tab=b.dataset.tab;closeModalIfCard();render();if(tab==='game'&&S.open)showCard();return}
  if(b.dataset.count){S.setup.count=+b.dataset.count;
    const used=new Set();S.setup.teams.forEach(t=>{if(used.has(t.fig))t.fig=FIGS.find(f=>!used.has(f.id)).id;used.add(t.fig)});save();render();return}
  if(b.dataset.fig){S.setup.teams[+b.dataset.team].fig=b.dataset.fig;save();render();return}
  if(b.dataset.adj!==undefined){const t=S.teams[+b.dataset.adj];t.hearts=Math.max(0,t.hearts+(+b.dataset.d));save();render();return}
  switch(b.id){
    case 'start':newGame();break;
    case 'roll':roll();break;
    case 'ok':resolveTask(true);break;
    case 'no':resolveTask(false);break;
    case 'fx':applyFx();break;
    case 'tstart':startTimer(+b.dataset.sec);break;
    case 'newgame':
      if(b.dataset.confirm){S.phase='setup';closeModal();save();render()}
      else{b.dataset.confirm='1';b.textContent='Точно начать заново? Нажмите ещё раз';setTimeout(()=>{if(b.isConnected){delete b.dataset.confirm;b.textContent='Новая игра'}},4000)}
      break;
    case 'again':closeModal();newGame();break;
    case 'viewboard':closeModal();break;
  }
});
function closeModalIfCard(){clearInterval(timerId);timerId=null;$('#modal').innerHTML=''}
document.addEventListener('input',e=>{if(e.target.dataset.name!==undefined){S.setup.teams[+e.target.dataset.name].name=e.target.value;save()}});
document.addEventListener('keydown',e=>{if((e.code==='Space'||e.key===' ')&&!e.target.closest('input,button')&&!S.open){e.preventDefault();roll()}});

function start(data){
  let saved=null;
  if(data&&data.S)saved=data.S;
  else{try{saved=JSON.parse(localStorage.getItem('marshrut-dobra-3d')||'null')}catch(e){}}
  S=saved&&saved.setup&&saved.v===2?saved:{v:2,phase:'setup',setup:defaultSetup(),teams:[],log:[],cur:0};
  if(data&&data.tab)tab=data.tab;
  computePts();render();
  if(S.phase==='play'&&S.open&&tab==='game')showCard();
}
window.claude?.hot?.snapshot?.(()=>({S,tab}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
</script>
