name: Установщик для Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Зависимости
        run: npm ci
      - name: Сборка игры
        run: npm run build:desktop
      - name: Сборка установщика
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --win nsis portable --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Severny-Dron-Windows
          path: |
            desktop/release/*.exe
          retention-days: 30
