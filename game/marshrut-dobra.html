<title>Маршрут добра</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: настольная игра — карта города слева, «стол ведущего» (кубик, команды, журнал) справа; на телефоне всё в одну колонку */
:root{
  --bg:#EAF1EE; --panel:#FFFFFF; --ink:#1E2A31; --muted:#62727B; --line:#D2DDD9;
  --accent:#1D7E70; --accent-ink:#FFFFFF;
  --road:#566573; --road-dash:#F4F7F6; --tile:#FFFFFF;
  --park:#CBE6C1; --water:#CDE1F1; --block:#DDE3EC; --sand:#F3E6C9;
  --red:#DE434C; --green:#3B9E49; --yellow:#EDB021; --purple:#8657CF;
  --red-soft:#FCE3E4; --green-soft:#E0F2E2; --yellow-soft:#FDF1D3; --purple-soft:#EEE6FA;
  --shadow:0 1px 2px rgba(20,40,40,.08),0 6px 20px rgba(20,40,40,.08);
  --f-display:"Unbounded","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111B1F; --panel:#1A262B; --ink:#E6EEEB; --muted:#93A4AB; --line:#2B3B41;
  --accent:#3DB5A2; --accent-ink:#0D1A1C;
  --road:#3B4A55; --road-dash:#C9D3D6; --tile:#22323A;
  --park:#1E3826; --water:#182E3E; --block:#222E37; --sand:#3A3324;
  --red:#F0646C; --green:#5CC36A; --yellow:#F5C44C; --purple:#A57EEA;
  --red-soft:#3A2023; --green-soft:#1D3322; --yellow-soft:#3A311B; --purple-soft:#2D2440;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111B1F; --panel:#1A262B; --ink:#E6EEEB; --muted:#93A4AB; --line:#2B3B41;
  --accent:#3DB5A2; --accent-ink:#0D1A1C;
  --road:#3B4A55; --road-dash:#C9D3D6; --tile:#22323A;
  --park:#1E3826; --water:#182E3E; --block:#222E37; --sand:#3A3324;
  --red:#F0646C; --green:#5CC36A; --yellow:#F5C44C; --purple:#A57EEA;
  --red-soft:#3A2023; --green-soft:#1D3322; --yellow-soft:#3A311B; --purple-soft:#2D2440;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

/* шапка */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand h1{font-size:clamp(22px,3.2vw,32px);font-weight:800;letter-spacing:-.01em}
.brand h1 span{color:var(--red)}
.brand small{display:block;color:var(--muted);font-size:13px;font-weight:600}
.tabs{display:flex;gap:4px;background:var(--panel);padding:4px;border-radius:999px;box-shadow:var(--shadow)}
.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:999px;font-weight:700;font-size:14px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}

/* игровой экран */
.game{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:960px){.game{grid-template-columns:minmax(0,1fr)}}
.board{background:var(--panel);border-radius:22px;box-shadow:var(--shadow);padding:10px;min-width:0}
.board svg{display:block;width:100%;height:auto}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.box{background:var(--panel);border-radius:18px;box-shadow:var(--shadow);padding:16px}
.label{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.turn{display:flex;flex-direction:column;gap:12px}
.turn-head{display:flex;align-items:center;gap:12px}
.turn-fig{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:26px;flex:none;border:3px solid var(--tc)}
.turn-name{font-family:var(--f-display);font-weight:700;font-size:19px}
.roll-row{display:flex;align-items:center;gap:14px}
.die{width:76px;height:76px;flex:none;border-radius:16px;background:var(--tile);border:2px solid var(--line);
  display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:11px;gap:2px;box-shadow:inset 0 -4px 0 var(--line)}
.die i{width:13px;height:13px;border-radius:50%;background:var(--ink);place-self:center;opacity:0}
.die i.on{opacity:1}
.die.rolling{animation:shake .5s linear infinite}
@keyframes shake{0%{transform:rotate(0)}25%{transform:rotate(-14deg) translateY(-3px)}50%{transform:rotate(10deg)}75%{transform:rotate(-6deg) translateY(-2px)}100%{transform:rotate(0)}}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:800;font-size:16px;background:var(--accent);color:var(--accent-ink);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.big{flex:1;font-size:17px;padding:16px}
.hint{font-size:14px;color:var(--muted);min-height:1.45em}
.hint b{color:var(--ink)}

.teams{display:flex;flex-direction:column;gap:8px}
.team{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:14px;border:2px solid transparent}
.team.cur{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 10%,transparent)}
.team .f{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;border:2.5px solid var(--tc);background:var(--tile)}
.team .n{font-weight:800;overflow-wrap:anywhere}
.team .p{font-size:13px;color:var(--muted)}
.team .p em{font-style:normal;color:var(--purple);font-weight:700}
.hearts{display:flex;align-items:center;gap:6px}
.hearts b{font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums;color:var(--red);min-width:1.4em;text-align:right}
.adj{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);background:transparent;font-weight:800;line-height:1;padding:0}
.bank{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);padding-top:10px;border-top:1px dashed var(--line);margin-top:4px}
.bank b{color:var(--ink);font-variant-numeric:tabular-nums}

.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:210px;overflow:auto;font-size:14px}
.log li{padding-left:12px;border-left:3px solid var(--line);color:var(--muted)}
.log li:first-child{color:var(--ink);border-left-color:var(--accent)}

.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);padding:8px 6px 2px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block;border:3px solid}

/* SVG карты */
.cell-num{font-family:var(--f-display);font-weight:700;font-size:13px;fill:var(--muted)}
.loc-name{font-family:var(--f-display);font-weight:700;font-size:15px;fill:var(--ink)}
.piece{transition:transform .22s ease-in-out}
.piece.active circle.ring{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{stroke-width:7}}

/* модальные окна */
.overlay{position:fixed;inset:0;background:rgba(10,20,22,.55);display:grid;place-items:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.card{width:min(480px,100%);border-radius:24px;background:var(--panel);box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85) rotate(-3deg);opacity:0}}
.card-top{background:var(--cc);color:#fff;padding:18px 22px;display:flex;align-items:center;gap:14px}
.card-top .ic{font-size:34px;width:58px;height:58px;border-radius:16px;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none}
.card-top h2{font-size:20px;color:#fff}
.card-top small{display:block;font-weight:700;opacity:.9;font-size:13px}
.card-body{padding:22px;display:flex;flex-direction:column;gap:18px;background:var(--cs)}
.card-text{font-size:21px;font-weight:700;line-height:1.35;text-wrap:pretty}
.card-for{font-size:14px;color:var(--muted)}
.timer{display:flex;align-items:center;gap:12px}
.timer-num{font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;min-width:3.2ch}
.timer-bar{flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.timer-bar i{display:block;height:100%;background:var(--cc);width:100%;transition:width 1s linear}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1 1 160px}
.btn.ok{background:var(--green);color:#fff}
.btn.no{background:transparent;border:2px solid var(--line);color:var(--ink);box-shadow:none}

/* стартовый экран */
.setup{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
@media (max-width:860px){.setup{grid-template-columns:minmax(0,1fr)}}
.hero{background:var(--panel);border-radius:22px;box-shadow:var(--shadow);padding:clamp(20px,4vw,40px);display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden}
.hero h2{font-size:clamp(30px,5vw,52px);font-weight:800;letter-spacing:-.02em}
.hero h2 span{color:var(--red)}
.hero p{margin:0;max-width:56ch;font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 12px;border-radius:999px;font-size:14px;font-weight:700;background:var(--cs);color:var(--ink);border:2px solid var(--cc)}
.team-setup{display:flex;flex-direction:column;gap:12px}
.ts{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:16px;border:2px solid var(--line);background:var(--panel)}
.ts-head{display:flex;gap:10px;align-items:center}
.ts input{flex:1;min-width:0;font:inherit;font-weight:800;font-size:17px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.fig{border:2px solid var(--line);background:var(--tile);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;text-align:center;line-height:1.15}
.fig span{font-size:26px}
.fig[aria-pressed="true"]{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 14%,var(--tile))}
.fig[disabled]{opacity:.35;cursor:not-allowed}
.count{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.count button{border:2px solid var(--line);background:var(--panel);border-radius:10px;padding:6px 12px;font-weight:800}
.count button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* правила и карточки */
.page{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.page .box h3{font-size:17px;margin-bottom:10px}
.page ul,.page ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
table{width:100%;border-collapse:collapse;font-size:15px}
td{padding:7px 0;border-bottom:1px solid var(--line)}
td:last-child{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.deck{border-radius:18px;overflow:hidden;box-shadow:var(--shadow);background:var(--cs)}
.deck .card-top{padding:14px 18px}
.deck ol{padding:16px 18px 18px 36px;margin:0;display:flex;flex-direction:column;gap:8px;font-weight:600}

/* финал */
.final .card-top{justify-content:center;text-align:center;flex-direction:column;padding:28px 22px}
.final .card-top h2{font-size:24px}
.podium{display:flex;flex-direction:column;gap:10px}
.pod{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border-radius:14px;background:var(--panel);border:2px solid var(--line)}
.pod.win{border-color:var(--yellow)}
.pod .big{font-size:30px;text-align:center}
.pod b{font-family:var(--f-display);color:var(--red);font-size:20px}
.pod small{display:block;color:var(--muted);font-weight:700}
canvas.conf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="21" fill="var(--red)"/><path d="M22 33s-10-6.2-10-13a5.6 5.6 0 0 1 10-3.4A5.6 5.6 0 0 1 32 20c0 6.8-10 13-10 13z" fill="#fff"/></svg>
      <div><h1>Маршрут <span>добра</span></h1><small>Игра для команд волонтёров · 30 клеток · 20 карточек</small></div>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" id="tab-game" aria-selected="true" data-tab="game">Игра</button>
      <button role="tab" id="tab-rules" aria-selected="false" data-tab="rules">Правила</button>
      <button role="tab" id="tab-cards" aria-selected="false" data-tab="cards">Карточки</button>
    </nav>
  </header>
  <main id="view"></main>
</div>
<div id="modal"></div>

<script>
(()=>{
const FIGS=[
  {id:'vol',e:'🙋',n:'Волонтёр',c:'#E0464E'},
  {id:'doc',e:'🩺',n:'Врач',c:'#2C7DD6'},
  {id:'eco',e:'🌳',n:'Защитник природы',c:'#2E9E52'},
  {id:'pet',e:'🐾',n:'Помощник животных',c:'#E08A1E'},
];
const TYPES={
  H:{n:'Доброе дело',e:'❤️',c:'--red',s:'--red-soft',color:'красная'},
  L:{n:'Экология',e:'🌱',c:'--green',s:'--green-soft',color:'зелёная'},
  S:{n:'Творческое задание',e:'⭐',c:'--yellow',s:'--yellow-soft',color:'жёлтая'},
  X:{n:'Сюрприз',e:'❗',c:'--purple',s:'--purple-soft',color:'фиолетовая'},
};
const CARDS={
  H:[{t:'Назовите три способа помочь пожилым людям.'},{t:'Как можно поддержать ребёнка, который чувствует себя одиноко?'},{t:'Придумайте акцию помощи животным.'},{t:'Назовите три вещи, которыми можно поделиться с нуждающимися.'},{t:'Как помочь новому ученику в школе освоиться?'}],
  L:[{t:'Назовите три способа уменьшить количество мусора.'},{t:'Придумайте акцию по озеленению города.'},{t:'Как привлечь людей к уборке парка?'},{t:'Назовите три способа экономить воду.'},{t:'Придумайте способ повторно использовать старые вещи.'}],
  S:[{t:'За 30 секунд придумайте название волонтёрского движения.',sec:30},{t:'Придумайте девиз команды.'},{t:'Назовите необычный способ привлечь новых волонтёров.'},{t:'Придумайте мероприятие для детей.'},{t:'Создайте идею благотворительной акции за одну минуту.',sec:60}],
  X:[{t:'Вам помогли два новых волонтёра! Сделайте ещё один ход.',fx:'again'},{t:'Вы организовали хорошую акцию! Получите 2 сердечка.',fx:'h2'},{t:'Вы забыли подготовить материалы. Пропустите один ход.',fx:'skip'},{t:'Жители города поддержали вашу команду! Получите 1 сердечко.',fx:'h1'},{t:'Вам нужна помощь другой команды. Попросите её назвать один способ решения вашей проблемы.',fx:'help'}],
};
// клетки 1..30: 1 — обычная, 2..29 по шаблону, 30 — финиш
const PATTERN='HOLSXOHLOSXHLOSHXLOSHLXOSHLX';
const CELLS=['START','O',...PATTERN.split(''),'FIN'];
const FINISH=30, BANK=20, FINISH_BONUS=2;
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const freshDecks=()=>Object.fromEntries(Object.keys(CARDS).map(k=>[k,shuffle(CARDS[k].map((_,i)=>i))]));
const defaultSetup=()=>({count:2,teams:[{name:'Лучики',fig:'vol'},{name:'Добряки',fig:'eco'},{name:'Улыбки',fig:'doc'},{name:'Друзья',fig:'pet'}]});

let S, tab='game', busy=false, timerId=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fig=id=>FIGS.find(f=>f.id===id);
const save=()=>{try{localStorage.setItem('marshrut-dobra',JSON.stringify(S))}catch(e){}};
const given=()=>S.teams?S.teams.reduce((a,t)=>a+t.hearts,0):0;
const log=m=>{S.log.unshift(m);S.log=S.log.slice(0,40)};
const plural=(n,a,b,c)=>{n=Math.abs(n)%100;const d=n%10;return n>10&&n<20?c:d===1?a:d>1&&d<5?b:c};
const heartsW=n=>n+' '+plural(n,'сердечко','сердечка','сердечек');
const cellsW=n=>n+' '+plural(n,'клетку','клетки','клеток');

/* ---------- карта ---------- */
const PATH="M 40 92 C 240 30, 420 160, 620 90 S 840 70, 880 95 A 112 112 0 0 1 880 320 C 690 380, 560 262, 400 322 S 180 356, 140 320 A 112 112 0 0 0 140 545 C 330 610, 470 480, 650 545 S 880 560, 950 545";
let PTS=null;
function computePts(){
  const ns='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(ns,'svg');svg.style.cssText='position:absolute;width:0;height:0;visibility:hidden';
  const p=document.createElementNS(ns,'path');p.setAttribute('d',PATH);svg.appendChild(p);document.body.appendChild(svg);
  const L=p.getTotalLength();PTS=[];
  for(let i=0;i<=FINISH;i++){const q=p.getPointAtLength(L*i/FINISH);PTS.push([q.x,q.y])}
  svg.remove();
}
function boardSVG(){
  const locs=[
    {x:250,y:205,w:200,h:78,e:'🌳',n:'Парк',z:'--park'},
    {x:640,y:208,w:230,h:78,e:'🐶',n:'Приют для животных',z:'--sand'},
    {x:290,y:434,w:190,h:78,e:'🏫',n:'Школа',z:'--block'},
    {x:690,y:432,w:190,h:78,e:'🏥',n:'Больница',z:'--block'},
  ];
  let g='';
  // декор: река и деревья
  g+=`<path d="M -10 20 C 200 -10, 300 40, 520 8 S 900 -12, 1010 18 L 1010 -10 L -10 -10 Z" fill="var(--water)"/>`;
  g+=`<path d="M 1010 600 C 900 640, 760 600, 600 632 L 600 650 L 1010 650 Z" fill="var(--water)"/>`;
  [[120,196],[178,236],[366,186],[64,430],[520,424],[930,206],[960,420],[40,620],[470,630]].forEach(([x,y],i)=>{
    g+=`<circle cx="${x}" cy="${y}" r="${14+(i%3)*4}" fill="var(--park)"/>`});
  locs.forEach(l=>{
    g+=`<g><rect x="${l.x-l.w/2}" y="${l.y-l.h/2}" width="${l.w}" height="${l.h}" rx="18" fill="var(${l.z})"/>
    <text x="${l.x}" y="${l.y-4}" text-anchor="middle" font-size="28">${l.e}</text>
    <text class="loc-name" x="${l.x}" y="${l.y+26}" text-anchor="middle">${l.n}</text></g>`});
  // дорога
  g+=`<path d="${PATH}" fill="none" stroke="var(--road)" stroke-width="58" stroke-linecap="round"/>`;

    }else if(t==='FIN'){
      g+=`<g><circle cx="${x}" cy="${y}" r="40" fill="var(--yellow)" stroke="var(--ink)" stroke-width="3"/><text x="${x}" y="${y-3}" text-anchor="middle" font-size="24">🏆</text><text x="${x}" y="${y+20}" text-anchor="middle" font-family="var(--f-display)" font-weight="800" font-size="11" fill="#1E2A31">ФИНИШ</text></g>`;
    }else{

      g+=`</g>`;

  const n=S.teams.length;
  S.teams.forEach((t,i)=>{
    const f=fig(t.fig);
    g+=`<g class="piece${S.phase==='play'&&i===S.cur?' active':''}" id="pc${i}" style="transform:translate(${piecePos(i,t.pos).join('px,')}px)">
      <ellipse cx="0" cy="20" rx="17" ry="5" fill="rgba(0,0,0,.25)"/>
      <circle class="ring" r="20" fill="var(--panel)" stroke="${f.c}" stroke-width="5"/>
      <text y="7" text-anchor="middle" font-size="20">${f.e}</text></g>`;
  });
  return `<svg viewBox="-10 -10 1020 660" role="img" aria-label="Карта города: дорожка из 30 клеток через парк, приют для животных, школу и больницу">${g}</svg>`;
}
const OFF=[[-14,-16],[14,-16],[-14,14],[14,14]];

/* ---------- кубик и ходы ---------- */
function setDie(n){const d=$('#die');if(!d)return;[...d.children].forEach((p,i)=>p.classList.toggle('on',PIPS[n].includes(i)))}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function setHint(h){S.hint=h;const el=$('#hint');if(el)el.innerHTML=h}

async function roll(){
  if(busy||S.phase!=='play'||tab!=='game')return;
  busy=true;$('#roll').disabled=true;
  const d=$('#die');d.classList.add('rolling');
  let n=1;
  for(let k=0;k<(reduced?1:9);k++){n=1+(Math.random()*6|0);setDie(n);await wait(60)}
  d.classList.remove('rolling');S.lastRoll=n;
  const t=S.teams[S.cur];
  log(`<b>${esc(t.name)}</b> выбросили ${n}.`);
  const need=FINISH-t.pos;
  if(n>need){
    log(`До финиша ${cellsW(need)} — нужно точное число. Фигурка остаётся на месте.`);
    setHint(`Выпало <b>${n}</b>, а до финиша ${cellsW(need)}. Стоим на месте.`);
    await wait(900);return endTurn();
  }
  setHint(`Выпало <b>${n}</b>! Идём…`);
  for(let s=0;s<n;s++){
    t.pos++;
    const el=$('#pc'+S.cur);if(el)el.style.transform=`translate(${piecePos(S.cur,t.pos).join('px,')}px)`;
    await wait(reduced?40:260);
  }
  land();
}
function land(){
  const t=S.teams[S.cur], c=CELLS[t.pos];
  if(c==='FIN')return finish();
  if(c==='O'){
    log(`Клетка ${t.pos} — обычная.`);
    return endTurn();
  }
  if(!S.decks[c].length)S.decks[c]=shuffle(CARDS[c].map((_,i)=>i));
  const idx=S.decks[c].shift();
  S.open={type:c,idx};save();
  showCard();
}
function endTurn(again){
  closeModal();
  if(!again){
    const n=S.teams.length;
    for(let k=0;k<n;k++){
      S.cur=(S.cur+1)%n;
      const t=S.teams[S.cur];
      if(t.skip){t.skip=0;log(`<b>${esc(t.name)}</b> пропускают ход.`);continue}
      break;
    }
  }
  const t=S.teams[S.cur];
  S.hint=again?`<b>${esc(t.name)}</b> ходят ещё раз!`:`Ход команды <b>${esc(t.name)}</b>.`;
  busy=false;save();render();
}
function finish(){
  const t=S.teams[S.cur];
  t.hearts+=FINISH_BONUS;t.finished=true;
  log(`🏆 <b>${esc(t.name)}</b> первыми дошли до финиша и получают ${heartsW(FINISH_BONUS)}!`);
  S.phase='end';S.finisher=S.cur;S.hint=`<b>${esc(t.name)}</b> на финише! Игра окончена.`;busy=false;save();render();
}

/* ---------- карточка ---------- */
function showCard(){
  const {type,idx}=S.open, ty=TYPES[type], card=CARDS[type][idx], t=S.teams[S.cur];
  const surprise=type==='X';
  const sec=card.sec||60;
  $('#modal').innerHTML=`<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="ctitle">
    <div class="card" style="--cc:var(${ty.c});--cs:var(${ty.s})">
      <div class="card-top"><div class="ic">${ty.e}</div><div><small>Клетка ${t.pos} · ${ty.color} карточка</small><h2 id="ctitle">${ty.n}</h2></div></div>
      <div class="card-body">
        <div class="card-for">Задание для команды <b>${esc(t.name)}</b></div>
        <div class="card-text">${card.t}</div>
        ${surprise?'':`<div class="timer"><div class="timer-num" id="tnum">${fmt(sec)}</div><div class="timer-bar"><i id="tbar"></i></div><button class="btn ghost" id="tstart" data-sec="${sec}">Таймер</button></div>`}
        <div class="actions">${surprise
          ?`<button class="btn" id="fx" style="background:var(--purple);color:#fff">${fxLabel(card.fx)}</button>`
          :`<button class="btn ok" id="ok">Справились ❤️ +1</button><button class="btn no" id="no">Не справились</button>`}</div>
      </div></div></div>`;
  ($('#ok')||$('#fx')).focus();
}
const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
const fxLabel=fx=>({again:'Ходить ещё раз',h2:'Забрать 2 сердечка',skip:'Понятно, пропускаем',h1:'Забрать сердечко',help:'Другая команда помогла'}[fx]);
function closeModal(){clearInterval(timerId);timerId=null;$('#modal').innerHTML='';S.open=null}
function startTimer(sec){
  clearInterval(timerId);let left=sec;const num=$('#tnum'),bar=$('#tbar');
  bar.style.width='100%';
  timerId=setInterval(()=>{left--;num.textContent=fmt(Math.max(0,left));bar.style.width=(Math.max(0,left)/sec*100)+'%';
    if(left<=0){clearInterval(timerId);timerId=null;num.textContent='Время!';beep()}},1000);
}
let actx=null;
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();[0,.25].forEach(d=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);g.gain.setValueAtTime(.2,actx.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d+.2);o.start(actx.currentTime+d);o.stop(actx.currentTime+d+.22)})}catch(e){}}
function resolveTask(ok){
  const t=S.teams[S.cur];
  if(ok){t.hearts++;log(`<b>${esc(t.name)}</b> справились с заданием «${TYPES[S.open.type].n}» и получают сердечко ❤️`)}
  else log(`<b>${esc(t.name)}</b> не справились — сердечка нет.`);
  endTurn();
}
function applyFx(){
  const t=S.teams[S.cur], fx=CARDS.X[S.open.idx].fx, nm=`<b>${esc(t.name)}</b>`;
  if(fx==='again'){log(`${nm}: два новых волонтёра помогли — ещё один ход!`);return endTurn(true)}
  if(fx==='h2'){t.hearts+=2;log(`${nm} организовали хорошую акцию: +2 ❤️`)}
  if(fx==='h1'){t.hearts+=1;log(`${nm}: жители города поддержали команду, +1 ❤️`)}
  if(fx==='skip'){t.skip=1;log(`${nm} забыли подготовить материалы и пропустят следующий ход.`)}
  if(fx==='help'){log(`${nm} попросили помощи у другой команды.`)}
  endTurn();
}

/* ---------- финал ---------- */
function showFinal(){
  const order=S.teams.map((t,i)=>({...t,i})).sort((a,b)=>b.hearts-a.hearts||(b.i===S.finisher)-(a.i===S.finisher));
  const w=order[0];
  $('#modal').innerHTML=`<div class="overlay final" role="dialog" aria-modal="true" aria-labelledby="ftitle">
    <div class="card" style="--cc:var(--red);--cs:var(--bg)">
      <div class="card-top"><div class="ic" style="font-size:40px;width:72px;height:72px">🏆</div><h2 id="ftitle">Вы сделали этот город добрее!</h2><small>Подсчёт сердечек и награждение</small></div>
      <div class="card-body">
        <div class="podium">${order.map((t,k)=>`<div class="pod${k===0?' win':''}">
          <div class="big">${k===0?'🏆':'📜'}</div>
          <div><div style="font-weight:800">${fig(t.fig).e} ${esc(t.name)}</div><small>${k===0?'Главные волонтёры города · кубок и шоколадки':'Диплом «Добрые сердца»'}${t.i===S.finisher?' · первыми на финише':''}</small></div>
          <b>${t.hearts} ❤️</b></div>`).join('')}</div>
        <div class="card-for">Всего собрано ${heartsW(given())}. Спасибо всем волонтёрам!</div>
        <div class="actions"><button class="btn" id="again">Сыграть ещё раз</button><button class="btn no" id="viewboard">Посмотреть карту</button></div>
      </div></div></div>`;
  confetti();
}
function confetti(){
  if(reduced||document.querySelector('canvas.conf'))return;
  const c=document.createElement('canvas');c.className='conf';document.body.appendChild(c);
  const x=c.getContext('2d');const W=c.width=innerWidth,H=c.height=innerHeight;
  const cols=['#DE434C','#3B9E49','#EDB021','#8657CF','#2C7DD6'];
  const P=Array.from({length:90},()=>({x:Math.random()*W,y:-20-Math.random()*H*.6,v:2+Math.random()*3,r:6+Math.random()*8,a:Math.random()*6,c:cols[Math.random()*5|0]}));
  let f=0;(function step(){x.clearRect(0,0,W,H);P.forEach(p=>{p.y+=p.v;p.a+=.05;const s=p.r;x.save();x.translate(p.x+Math.sin(p.a)*10,p.y);x.fillStyle=p.c;
    x.beginPath();x.moveTo(0,s*.35);x.bezierCurveTo(-s,-s*.3,-s*.4,-s,0,-s*.45);x.bezierCurveTo(s*.4,-s,s,-s*.3,0,s*.35);x.fill();x.restore()});
    if(++f<240)requestAnimationFrame(step);else c.remove()})();
}

/* ---------- старт ---------- */
function newGame(){
  const st=S.setup;
  S.teams=st.teams.slice(0,st.count).map(t=>({name:t.name.trim()||'Команда',fig:t.fig,pos:0,hearts:0,skip:0}));
  S.phase='play';S.cur=0;S.decks=freshDecks();S.log=['Маршрут начинается! Команды стоят на старте.'];S.open=null;S.finisher=null;
  S.hint=`Первыми ходят <b>${esc(S.teams[0].name)}</b>.`;
  save();render();
}

document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.tab){tab=b.dataset.tab;closeModalIfCard();render();if(tab==='game'&&S.open)showCard();return}
  if(b.dataset.count){S.setup.count=+b.dataset.count;
    const used=new Set();S.setup.teams.forEach(t=>{if(used.has(t.fig))t.fig=FIGS.find(f=>!used.has(f.id)).id;used.add(t.fig)});save();render();return}
  if(b.dataset.fig){S.setup.teams[+b.dataset.team].fig=b.dataset.fig;save();render();return}
  if(b.dataset.adj!==undefined){const t=S.teams[+b.dataset.adj];t.hearts=Math.max(0,t.hearts+(+b.dataset.d));save();render();return}
  switch(b.id){
    case 'start':newGame();break;
    case 'roll':roll();break;
    case 'ok':resolveTask(true);break;
    case 'no':resolveTask(false);break;
    case 'fx':applyFx();break;
    case 'tstart':startTimer(+b.dataset.sec);break;
    case 'newgame':
      if(b.dataset.confirm){S.phase='setup';closeModal();save();render()}
      else{b.dataset.confirm='1';b.textContent='Точно начать заново? Нажмите ещё раз';setTimeout(()=>{if(b.isConnected){delete b.dataset.confirm;b.textContent='Новая игра'}},4000)}
      break;
    case 'again':closeModal();newGame();break;
    case 'viewboard':closeModal();break;
  }
});
function closeModalIfCard(){clearInterval(timerId);timerId=null;$('#modal').innerHTML=''}
document.addEventListener('input',e=>{if(e.target.dataset.name!==undefined){S.setup.teams[+e.target.dataset.name].name=e.target.value;save()}});
document.addEventListener('keydown',e=>{if((e.code==='Space'||e.key===' ')&&!e.target.closest('input,button')&&!S.open){e.preventDefault();roll()}});

function start(data){
  let saved=null;
  if(data&&data.S)saved=data.S;
  else{try{saved=JSON.parse(localStorage.getItem('marshrut-dobra')||'null')}catch(e){}}
  S=saved&&saved.setup?saved:{phase:'setup',setup:defaultSetup(),teams:[],log:[],cur:0};
  if(data&&data.tab)tab=data.tab;
  computePts();render();
  if(S.phase==='play'&&S.open&&tab==='game')showCard();
}
window.claude?.hot?.snapshot?.(()=>({S,tab}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
</script>
